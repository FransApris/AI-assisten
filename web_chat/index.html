<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APRIS — Asisten Pribadi Cerdas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #080c14;
      --bg-panel:   #0d1220;
      --bg-card:    #111827;
      --bg-input:   #1a2035;
      --border:     rgba(99,130,255,0.15);
      --border-glow:rgba(99,130,255,0.4);
      --accent:     #6382ff;
      --accent-2:   #a78bfa;
      --accent-glow:rgba(99,130,255,0.25);
      --text-1:     #f0f4ff;
      --text-2:     #8b9cc8;
      --text-3:     #4b5a80;
      --user-bg:    linear-gradient(135deg,#6382ff,#a78bfa);
      --apris-bg:   #141c30;
      --success:    #34d399;
      --radius-lg:  18px;
      --radius-md:  12px;
      --radius-sm:  8px;
      --shadow:     0 8px 32px rgba(0,0,0,0.5);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text-1);
      overflow: hidden;
    }

    /* ── Background animated gradient ────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(99,130,255,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(167,139,250,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Layout ───────────────────────────────────── */
    .app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh; max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ───────────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 24px;
      background: rgba(13,18,32,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--user-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }

    .header-info { flex: 1; }
    .header-info h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
    .header-info p  { font-size: 12px; color: var(--text-2); margin-top: 2px; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse-dot 2s ease infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.6; transform:scale(1.3); }
    }

    .btn-clear {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-2); font-size: 12px; font-family: inherit;
      padding: 6px 14px; border-radius: 20px; cursor: pointer;
      transition: all .2s;
    }
    .btn-clear:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Chat Area ────────────────────────────────── */
    #chat-area {
      flex: 1; overflow-y: auto; padding: 24px 24px 8px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-track { background: transparent; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Welcome screen ──────────────────────────── */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 16px; padding: 40px 20px;
      animation: fade-in .5s ease;
    }
    .welcome-icon {
      font-size: 56px;
      filter: drop-shadow(0 0 20px rgba(99,130,255,0.5));
    }
    .welcome h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .welcome h2 span { background: var(--user-bg); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .welcome p { font-size: 14px; color: var(--text-2); max-width: 360px; line-height: 1.6; }

    .quick-actions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 8px;
    }
    .quick-btn {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-2); font-size: 13px; font-family: inherit;
      padding: 8px 16px; border-radius: 20px; cursor: pointer;
      transition: all .2s;
    }
    .quick-btn:hover {
      border-color: var(--accent); color: var(--accent);
      background: rgba(99,130,255,0.08);
      transform: translateY(-1px);
    }

    /* ── Message Bubble ───────────────────────────── */
    .msg { display: flex; gap: 10px; animation: slide-up .3s ease; max-width: 100%; }
    @keyframes slide-up {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .msg.user  { flex-direction: row-reverse; }
    .msg.apris { flex-direction: row; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
      margin-top: 2px;
    }
    .msg.user  .msg-avatar { background: var(--user-bg); }
    .msg.apris .msg-avatar { background: var(--bg-card); border: 1px solid var(--border); }

    .msg-body { max-width: 75%; display: flex; flex-direction: column; gap: 4px; }
    .msg.user  .msg-body { align-items: flex-end; }
    .msg.apris .msg-body { align-items: flex-start; }

    .msg-bubble {
      padding: 12px 16px; border-radius: var(--radius-lg); line-height: 1.65;
      font-size: 14px; word-break: break-word;
    }
    .msg.user .msg-bubble {
      background: var(--user-bg);
      border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
      color: #fff;
    }
    .msg.apris .msg-bubble {
      background: var(--apris-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
      color: var(--text-1);
    }

    .msg-time { font-size: 11px; color: var(--text-3); padding: 0 4px; }

    /* Markdown-like formatting in APRIS replies */
    .msg-bubble strong { color: #c4cfff; font-weight: 600; }
    .msg-bubble em     { color: var(--text-2); font-style: italic; }
    .msg-bubble hr     { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 4px 0; }
    .msg-bubble li     { margin: 2px 0; }
    .msg-bubble code   {
      background: rgba(99,130,255,0.1); padding: 1px 6px;
      border-radius: 4px; font-size: 13px; font-family: monospace;
    }

    /* ── Typing Indicator ────────────────────────── */
    .typing { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); opacity: .5;
      animation: bounce .9s ease infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); opacity:1; }
    }

    /* ── Input Area ───────────────────────────────── */
    .input-area {
      padding: 16px 24px 20px;
      background: rgba(13,18,32,0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--bg-input); border-radius: var(--radius-lg);
      border: 1px solid var(--border); padding: 10px 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap:focus-within {
      border-color: var(--border-glow);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #msg-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-1); font-family: inherit; font-size: 14px;
      line-height: 1.5; resize: none; max-height: 140px;
      scrollbar-width: none;
    }
    #msg-input::placeholder { color: var(--text-3); }

    .send-btn {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: var(--user-bg); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, opacity .15s;
      color: #fff; font-size: 16px;
    }
    .send-btn:hover   { transform: scale(1.08); }
    .send-btn:active  { transform: scale(0.95); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .input-hint {
      font-size: 11px; color: var(--text-3);
      text-align: center; margin-top: 8px;
    }

    /* ── Error toast ──────────────────────────────── */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #ef4444; color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; z-index: 999;
      animation: fade-in .3s ease;
    }
    @keyframes fade-in { from { opacity:0; } to { opacity:1; } }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="avatar">A</div>
    <div class="header-info">
      <h1>APRIS</h1>
      <p>Asisten Pribadi Cerdas • Gemini AI</p>
    </div>
    <div class="status-dot" id="status-dot" title="Online"></div>
    <button class="btn-clear" onclick="clearChat()">Hapus Riwayat</button>
  </header>

  <!-- Chat Area -->
  <div id="chat-area">
    <div class="welcome" id="welcome-screen">
      <div class="welcome-icon">🌟</div>
      <h2><span>APRIS</span> siap membantu</h2>
      <p>Asisten pribadi multidisiplin berbahasa Indonesia. Tanyakan apa saja — jadwal, keuangan, sastra, filsafat, kesehatan, dan lebih banyak lagi.</p>
      <div class="quick-actions">
        <button class="quick-btn" onclick="quickSend('Siapa kamu dan apa yang bisa kamu bantu?')">Perkenalan</button>
        <button class="quick-btn" onclick="quickSend('Berikan tips manajemen waktu yang efektif')">Manajemen Waktu</button>
        <button class="quick-btn" onclick="quickSend('Jelaskan konsep stoikisme secara ringkas')">Filsafat Stoik</button>
        <button class="quick-btn" onclick="quickSend('Apa strategi investasi yang baik untuk pemula?')">Investasi</button>
        <button class="quick-btn" onclick="quickSend('Rekomendasikan novel Indonesia yang bagus')">Rekomendasi Buku</button>
        <button class="quick-btn" onclick="quickSend('Bagaimana cara mengelola stres dengan efektif?')">Kelola Stres</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div id="file-preview-container" style="display:none; margin-bottom: 10px; position:relative; width: max-content; background: var(--bg-body); padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px;">
      <span id="file-icon" style="font-size: 20px;">📄</span>
      <span id="file-name" style="font-size: 14px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
      <img id="image-preview" style="display:none; max-height: 80px; border-radius: 4px;" src="" />
      <button onclick="clearFile()" style="background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center;">✖</button>
    </div>
    <div class="input-wrap">
      <input type="file" id="file-input" accept="image/*, application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, text/plain" style="display:none" onchange="previewFile(event)">
      <button class="send-btn" style="background:var(--bg-card); color:var(--text-2); border:1px solid var(--border);" onclick="document.getElementById('file-input').click()" title="Lampirkan Gambar atau Dokumen">
        📎
      </button>
      <button class="send-btn" id="mic-btn" style="background:var(--bg-card); color:var(--text-2); border:1px solid var(--border);" onclick="toggleVoiceInput()" title="Bicara (Voice Input)">
        🎤
      </button>
      <textarea
        id="msg-input"
        placeholder="Ketik pesan atau bicara..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="speaker-btn" style="background:var(--bg-card); color:var(--text-2); border:1px solid var(--border);" onclick="toggleVoiceOutput()" title="Auto Baca Suara: OFF">
        🔇
      </button>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Kirim (Enter)">
        ➤
      </button>
    </div>
    <p class="input-hint">Enter untuk kirim &nbsp;·&nbsp; Shift+Enter untuk baris baru</p>
  </div>

</div>

<script>
  // URL dinamis: lokal → localhost:5052, Railway → URL yang sama dengan halaman
  const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? `${location.protocol}//${location.hostname}:5052`
    : `${location.protocol}//${location.host}`;
  const sessionId = "session_" + Date.now();
  let isTyping = false;

  // ── Auto-resize textarea ─────────────────────────
  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 140) + "px";
  }

  // ── Handle Enter/Shift+Enter ─────────────────────
  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Quick send buttons ───────────────────────────
  function quickSend(text) {
    document.getElementById("msg-input").value = text;
    sendMessage();
  }

  // ── Render markdown-lite ─────────────────────────
  function renderMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.*?)\*/g,     "<em>$1</em>")
      .replace(/`(.*?)`/g,       "<code>$1</code>")
      .replace(/^---+$/gm,       "<hr>")
      .replace(/^• (.+)$/gm,     "<li>$1</li>")
      .replace(/^[-•] (.+)$/gm,  "<li>$1</li>")
      .replace(/(<li>.*<\/li>)/s, "<ul>$1</ul>")
      .replace(/\n/g,            "<br>");
  }

  // ── Append message bubble ─────────────────────────
  function appendMsg(role, content, time, isRawHtml = false) {
    const welcome = document.getElementById("welcome-screen");
    if (welcome) welcome.remove();

    const area = document.getElementById("chat-area");
    const isUser = role === "user";
    const avatar = isUser ? "Anda" : "A";

    const div = document.createElement("div");
    div.className = `msg ${role}`;
    
    let renderedContent = "";
    if (isRawHtml) {
        renderedContent = content;
    } else {
        renderedContent = isUser ? escapeHtml(content) : renderMarkdown(content);
    }
    
    div.innerHTML = `
      <div class="msg-avatar">${isUser ? "👤" : "🌟"}</div>
      <div class="msg-body">
        <div class="msg-bubble">${renderedContent}</div>
        <span class="msg-time">${time}</span>
      </div>`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  // ── Typing indicator ─────────────────────────────
  function showTyping() {
    const area = document.getElementById("chat-area");
    const div  = document.createElement("div");
    div.className = "msg apris"; div.id = "typing-indicator";
    div.innerHTML = `
      <div class="msg-avatar">🌟</div>
      <div class="msg-body">
        <div class="msg-bubble">
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      </div>`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  // ── Toast error ───────────────────────────────────
  function showToast(msg) {
    const old = document.querySelector(".toast");
    if (old) old.remove();
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  // ── Escape HTML ───────────────────────────────────
  function escapeHtml(t) {
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  let currentFileBase64 = null;
  let currentFileName = null;
  let currentFileMime = null;

  function previewFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    currentFileName = file.name;
    currentFileMime = file.type || "application/octet-stream";
    
    const isImage = currentFileMime.startsWith("image/");

    const reader = new FileReader();
    reader.onload = function(e) {
      currentFileBase64 = e.target.result;
      
      document.getElementById('file-preview-container').style.display = 'flex';
      document.getElementById('file-name').textContent = currentFileName;
      
      if (isImage) {
        document.getElementById('image-preview').src = currentFileBase64;
        document.getElementById('image-preview').style.display = 'block';
        document.getElementById('file-icon').style.display = 'none';
      } else {
        document.getElementById('image-preview').style.display = 'none';
        document.getElementById('file-icon').style.display = 'inline-block';
      }
    };
    reader.readAsDataURL(file);
  }

  function clearFile() {
    currentFileBase64 = null;
    currentFileName = null;
    currentFileMime = null;
    document.getElementById('file-input').value = "";
    document.getElementById('file-preview-container').style.display = 'none';
    document.getElementById('image-preview').src = "";
  }

  // ── Send message ──────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById("msg-input");
    const btn   = document.getElementById("send-btn");
    const text  = input.value.trim();
    if (!text && !currentFileBase64) return;
    if (isTyping) return;

    const now = new Date().toLocaleTimeString("id-ID", {hour:"2-digit",minute:"2-digit"});
    let displayHtml = text;
    if (currentFileBase64) {
      if (currentFileMime.startsWith("image/")) {
        displayHtml = `<img src="${currentFileBase64}" style="max-width:100%; border-radius:8px; margin-bottom:8px;"><br>` + escapeHtml(text);
      } else {
        displayHtml = `<div style="background:var(--bg-card); padding:8px; border-radius:4px; margin-bottom:8px;">📄 <b>${currentFileName}</b></div>` + escapeHtml(text);
      }
    }
    
    // We bypass escapeHtml for the user message bubble because we are injecting an img/div tag safely
    appendMsg("user", displayHtml, now, true);
    
    input.value = ""; input.style.height = "auto";
    const payload = { message: text, session_id: sessionId };
    
    if (currentFileBase64) {
      // Hilangkan header data:...;base64,
      payload.file_base64 = currentFileBase64.split(',')[1];
      payload.file_mime = currentFileMime;
      payload.file_name = currentFileName;
      clearFile();
    }

    isTyping = true; btn.disabled = true;
    showTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method : "POST",
        headers: {"Content-Type":"application/json"},
        body   : JSON.stringify(payload),
      });
      const data = await res.json();
      hideTyping();

      if (data.error) { 
        showToast("Error: " + data.error); 
      }
      else { 
        appendMsg("apris", data.reply, data.time || now); 
        speakText(data.reply);
      }

    } catch (err) {
      hideTyping();
      showToast("Tidak dapat terhubung ke server APRIS. Pastikan chat_server.py berjalan.");
    } finally {
      isTyping = false; btn.disabled = false;
      input.focus();
    }
  }

  // ── Clear chat ────────────────────────────────────
  async function clearChat() {
    if (!confirm("Hapus seluruh riwayat percakapan?")) return;
    await fetch(`${API}/clear`, {
      method : "POST",
      headers: {"Content-Type":"application/json"},
      body   : JSON.stringify({ session_id: sessionId }),
    }).catch(() => {});
    const area = document.getElementById("chat-area");
    area.innerHTML = `
      <div class="welcome" id="welcome-screen">
        <div class="welcome-icon">🌟</div>
        <h2><span>APRIS</span> siap membantu</h2>
        <p>Riwayat percakapan dihapus. Mulai percakapan baru.</p>
        <div class="quick-actions">
          <button class="quick-btn" onclick="quickSend('Siapa kamu dan apa yang bisa kamu bantu?')">Perkenalan</button>
          <button class="quick-btn" onclick="quickSend('Berikan tips manajemen waktu yang efektif')">Manajemen Waktu</button>
          <button class="quick-btn" onclick="quickSend('Jelaskan konsep stoikisme secara ringkas')">Filsafat Stoik</button>
        </div>
      </div>`;
  }

  // ── Check server status ───────────────────────────
  async function checkStatus() {
    try {
      const res  = await fetch(`${API}/status`);
      const data = await res.json();
      const dot  = document.getElementById("status-dot");
      if (data.status === "online") {
        dot.style.background    = "var(--success)";
        dot.style.boxShadow     = "0 0 8px var(--success)";
        dot.title               = `Online · ${data.model}`;
      }
    } catch {
      const dot = document.getElementById("status-dot");
      dot.style.background = "#ef4444";
      dot.style.boxShadow  = "0 0 8px #ef4444";
      dot.title = "Server tidak terhubung";
    }
  }

  // ── Voice Mode ────────────────────────────────────
  let isVoiceOutputEnabled = false;
  let recognition = null;
  
  if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'id-ID';
    
    recognition.onstart = function() {
      const micBtn = document.getElementById("mic-btn");
      micBtn.style.background = "#ef4444";
      micBtn.style.color = "white";
      document.getElementById("msg-input").placeholder = "Mendengarkan...";
    };
    
    recognition.onresult = function(event) {
      let interimTranscript = '';
      let finalTranscript = '';
      
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          finalTranscript += event.results[i][0].transcript;
        } else {
          interimTranscript += event.results[i][0].transcript;
        }
      }
      
      const input = document.getElementById("msg-input");
      if (finalTranscript) {
        input.value = finalTranscript;
        sendMessage();
      } else {
        input.value = interimTranscript;
      }
    };
    
    recognition.onerror = function(event) {
      console.error("Speech recognition error", event.error);
      resetMicUI();
    };
    
    recognition.onend = function() {
      resetMicUI();
    };
  }
  
  function resetMicUI() {
    const micBtn = document.getElementById("mic-btn");
    micBtn.style.background = "var(--bg-card)";
    micBtn.style.color = "var(--text-2)";
    document.getElementById("msg-input").placeholder = "Ketik pesan atau bicara...";
  }

  function toggleVoiceInput() {
    if (!recognition) {
      showToast("Browser Anda tidak mendukung fitur mikrofon (Speech Recognition).");
      return;
    }
    try {
      recognition.start();
    } catch(e) {
      recognition.stop();
    }
  }

  function toggleVoiceOutput() {
    isVoiceOutputEnabled = !isVoiceOutputEnabled;
    const btn = document.getElementById("speaker-btn");
    if (isVoiceOutputEnabled) {
      btn.textContent = "🔊";
      btn.title = "Auto Baca Suara: ON";
      showToast("Fitur baca otomatis diaktifkan.");
    } else {
      btn.textContent = "🔇";
      btn.title = "Auto Baca Suara: OFF";
      window.speechSynthesis.cancel();
      showToast("Fitur baca otomatis dinonaktifkan.");
    }
  }

  function speakText(text) {
    if (!isVoiceOutputEnabled) return;
    window.speechSynthesis.cancel();
    
    // Hapus tag HTML, markdown, emoji
    let plainText = text.replace(/<[^>]+>/g, '')
                        .replace(/[#_*~`]/g, '')
                        .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');
                        
    const msg = new SpeechSynthesisUtterance(plainText);
    msg.lang = 'id-ID';
    msg.rate = 1.0;
    
    // Gunakan suara Google Indonesia jika tersedia
    const voices = window.speechSynthesis.getVoices();
    const idVoice = voices.find(v => v.lang === 'id-ID' && v.name.includes('Google'));
    if (idVoice) msg.voice = idVoice;
    
    window.speechSynthesis.speak(msg);
  }

  async function fetchBriefing() {
    try {
      const res = await fetch(`${API}/briefing`);
      const data = await res.json();
      if (data.briefing) {
        const now = new Date().toLocaleTimeString("id-ID", {hour:"2-digit",minute:"2-digit"});
        // Cek jika belum ada pesan (selain welcome screen)
        const area = document.getElementById("chat-area");
        if (area.querySelectorAll('.msg-row').length === 0) {
          // Hapus welcome screen agar briefing masuk dengan rapi
          area.innerHTML = '';
          appendMsg("apris", data.briefing, now);
        }
      }
    } catch (e) {
      console.log("Briefing failed to load");
    }
  }

  // Init
  checkStatus();
  fetchBriefing();
  setInterval(checkStatus, 30000);
  document.getElementById("msg-input").focus();
</script>
</body>
</html>
